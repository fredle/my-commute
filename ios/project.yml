# XcodeGen spec. CI runs `xcodegen generate` to produce MyCommute.xcodeproj,
# so no .xcodeproj is checked in (and none has to be made on a Mac).
name: MyCommute
options:
  bundleIdPrefix: net.leatham
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R53MF3F498
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MyCommute:
    type: application
    platform: iOS
    sources:
      - MyCommute
      - Shared
    dependencies:
      - target: MyCommuteWidgets
    info:
      path: MyCommute/Info.plist
      properties:
        CFBundleDisplayName: My Commute
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: My Commute uses your location to tell where you are on your journey and to time the drive.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.leatham.mycommute
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  MyCommuteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MyCommuteWidgets
      - Shared
    info:
      path: MyCommuteWidgets/Info.plist
      properties:
        CFBundleDisplayName: My Commute
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.leatham.mycommute.widgets
        SKIP_INSTALL: YES
