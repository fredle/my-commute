name: server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx tsc
      - run: npm test
        env:
          NODE_NO_WARNINGS: '1'
