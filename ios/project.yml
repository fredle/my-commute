# XcodeGen spec. CI runs `xcodegen generate` to produce MyCommute.xcodeproj,
# so no .xcodeproj is checked in (and none has to be made on a Mac).
name: MyCommute
options:
  bundleIdPrefix: net.leatham
  deploymentTarget:
    # 17.2 for Live Activity push-to-start (scheduled commutes start with no app running).
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R53MF3F498
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MyCommute:
    type: application
    platform: iOS
    sources:
      - MyCommute
      - Shared
    dependencies:
      - target: MyCommuteWidgets
    entitlements:
      path: MyCommute/MyCommute.entitlements
      properties:
        # Live Activity push tokens. Debug builds from Xcode get sandbox tokens, and
        # the app tells the server which kind it has (ServerConfig.apnsEnvironment).
        aps-environment: production
    info:
      path: MyCommute/Info.plist
      properties:
        CFBundleDisplayName: My Commute
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        # Geofences only (CLMonitor): no location background mode and no continuous GPS.
        NSLocationWhenInUseUsageDescription: Your location is used to set home or work from where you are now.
        NSLocationAlwaysAndWhenInUseUsageDescription: Lets the app notice when you leave home, reach a station or arrive, so your commute's Live Activity moves on and ends by itself. Your location stays on your phone.
        # The server in server/ (origin only, no path). See server/README.md.
        BackendURL: https://commute-api.leatham.net
        PrivacyPolicyURL: https://example.com/commute/privacy
        SupportURL: https://example.com/commute/support
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.leatham.mycommute
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  MyCommuteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MyCommuteWidgets
      - Shared
    info:
      path: MyCommuteWidgets/Info.plist
      properties:
        CFBundleDisplayName: My Commute
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.leatham.mycommute.widgets
        SKIP_INSTALL: YES
